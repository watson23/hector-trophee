<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- app.hector.golf is the one canonical origin: sessions, preferences and PWA
         installs live per-origin, so letting two working URLs circulate would split
         the field across two identity worlds. The old URL still works — it just
         lands here. Exact-hostname match, so previews and localhost are untouched. -->
    <script>
      if (location.hostname === "hector-trophee.vercel.app")
        location.replace("https://app.hector.golf" + location.pathname + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Hector Trophée 2026</title>
    <link rel="icon" type="image/svg+xml" href="/icons/mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="Live scoring for Hector Trophée 2026, Konopiště." />
    <meta property="og:title" content="Hector Trophée 2026" />
    <meta property="og:description" content="Live scoring · Konopiště · 24–27 September" />
    <meta property="og:image" content="https://app.hector.golf/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inconsolata:wght@400;600;700&family=Barlow+Semi+Condensed:wght@600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  </head>
  <body style="background: #0a0a0c">
    <div id="root"></div>
    <!-- If React never mounts — a broken cached bundle, a script error before the
         first render — the page would otherwise stay silently black. After eight
         seconds an empty root gets a plain message with the error, a reload, and a
         way to drop the cached app (service worker + caches; the session and scores
         stay) so the next load comes fresh from the network. -->
    <script>
      (function () {
        var lastError = "";
        window.addEventListener("error", function (e) {
          lastError = e.message || String(e.error || "");
        });
        window.addEventListener("unhandledrejection", function (e) {
          lastError = (e.reason && e.reason.message) || String(e.reason);
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (!root || root.childNodes.length > 0) return;
          var btn =
            "display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid #2c2b31;background:#1d1c20;color:#dfdde4;font:600 14px system-ui,sans-serif";
          root.innerHTML =
            '<div style="min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;color:#c2c0c9;text-align:center">' +
            '<div style="max-width:340px"><p style="font-weight:600;color:#efeef3;margin:0">The app did not start.</p>' +
            '<p style="font-size:13px;color:#9a98a6;line-height:1.5;margin:8px 0 0">' +
            (lastError ? "Error: " + lastError.replace(/</g, "&lt;") : "Nothing rendered. A cached copy of the app may be broken.") +
            "</p>" +
            '<button id="hectro-reload" style="' + btn + '">Reload</button>' +
            '<button id="hectro-reset" style="' + btn + '">Clear cached app and reload</button>' +
            '<p style="font-size:11px;color:#7c7a86;margin:10px 0 0">Scores live in the database; clearing the cache keeps your sign-in.</p></div></div>';
          document.getElementById("hectro-reload").onclick = function () {
            location.reload();
          };
          document.getElementById("hectro-reset").onclick = function () {
            var done = function () {
              location.reload();
            };
            var work = [];
            if (navigator.serviceWorker) {
              work.push(
                navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(rs.map(function (r) { return r.unregister(); }));
                }),
              );
            }
            if (window.caches) {
              work.push(
                caches.keys().then(function (ks) {
                  return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                }),
              );
            }
            Promise.all(work).then(done, done);
          };
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
